<!DOCTYPE html>
<!-- ===========================================================================
     VIV Fitness PWA - Главный HTML-каркас приложения
     ===========================================================================
     Назначение: Точка входа одностраничного приложения (SPA). Включает шапку,
     динамический контейнер экранов, виджет таймера отдыха, нижний хотбар (5 вкладок),
     модальный контейнер и подключение модульной архитектуры JS/CSS.
     =========================================================================== -->
<html lang="ru">
<head>
  <!-- БЛОК 1. Метатеги кодировки и мобильного масштабирования (Viewport & Safe Area) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VIV</title>
  
  <!-- БЛОК 2. Интеграция с Telegram WebApp SDK (отложенная загрузка для офлайн-режима) -->
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>

  <!-- БЛОК 3. Настройки PWA для iOS и Android -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VIV">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="1024x1024" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="apple-touch-icon" sizes="1024x1024" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- БЛОК 4. Подключение таблиц стилей и дизайн-токенов -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- БЛОК 5. Верхняя навигационная шапка (Header) -->
    <header class="app-header">
      <div class="header-slot header-left">
        <button id="back-btn" class="nav-back-btn hidden" aria-label="Назад">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
      </div>
      <h1 id="screen-title">Мои тренировки</h1>
      <div id="header-actions" class="header-slot header-right"></div>
    </header>

    <!-- БЛОК 6. Основная динамическая область рендера экранов (Main Content) -->
    <main id="main-content" class="screen-content">
      <!-- Динамические экраны монтируются сюда -->
    </main>

    <!-- БЛОК 7. Корневой контейнер плавающего таймера отдыха (Rest Timer Root) -->
    <div id="rest-timer-root"></div>

    <!-- БЛОК 8. Нижняя панель навигации — Хотбар (Bottom Navigation Bar: 5 вкладок) -->
    <nav class="bottom-nav">
      <button class="nav-item" data-tab="habits">
        <div class="nav-icon">
          <svg class="icon-outline" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <svg class="icon-filled" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-8.29 13.71a1 1 0 0 1-1.42 0l-3.29-3.29a1 1 0 1 1 1.42-1.42L10 14.59l6.29-6.3a1 1 0 0 1 1.42 1.42l-7 7z"></path></svg>
        </div>
        <span>Привычки</span>
      </button>
      <button class="nav-item active" data-tab="work">
        <div class="nav-icon">
          <svg class="icon-outline" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12h10"></path><rect x="4.5" y="7" width="2.5" height="10" rx="1"></rect><rect x="17" y="7" width="2.5" height="10" rx="1"></rect><path d="M2 9v6"></path><path d="M22 9v6"></path></svg>
          <svg class="icon-filled" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="11" width="10" height="2" rx="0.5"></rect><rect x="4.5" y="7" width="2.5" height="10" rx="1"></rect><rect x="17" y="7" width="2.5" height="10" rx="1"></rect><rect x="1.8" y="8.5" width="2" height="7" rx="0.8"></rect><rect x="20.2" y="8.5" width="2" height="7" rx="0.8"></rect></svg>
        </div>
        <span>Тренировки</span>
      </button>
      <button class="nav-item" data-tab="stats">
        <div class="nav-icon">
          <svg class="icon-outline" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="8" rx="1"></rect><rect x="10" y="5" width="4" height="15" rx="1"></rect><rect x="17" y="9" width="4" height="11" rx="1"></rect></svg>
          <svg class="icon-filled" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="8" rx="1"></rect><rect x="10" y="5" width="4" height="15" rx="1"></rect><rect x="17" y="9" width="4" height="11" rx="1"></rect></svg>
        </div>
        <span>Статистика</span>
      </button>
      <button class="nav-item" data-tab="profile">
        <div class="nav-icon">
          <svg class="icon-outline" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
          <svg class="icon-filled" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"></circle><path d="M12 14c-4.42 0-8 2.24-8 5v1.5a.5.5 0 0 0 .5.5h15a.5.5 0 0 0 .5-.5V19c0-2.76-3.58-5-8-5z"></path></svg>
        </div>
        <span>Профиль</span>
      </button>
      <button class="nav-item nav-item-logo" data-tab="shop" title="VIV" aria-label="VIV">
        <div class="nav-icon" style="display:flex; align-items:center; justify-content:center;">
          <img src="icon.svg" alt="VIV" style="height:15px; width:auto; max-width:48px; border:none; object-fit:contain; background:transparent;">
        </div>
      </button>
    </nav>

    <!-- БЛОК 9. Контейнер всплывающих модальных окон (Modal Container) -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div id="modal-container" class="modal-card"></div>
    </div>

    <!-- БЛОК 9.1. Контейнер колеса прокрутки чисел (Wheel Number Picker Overlay) -->
    <div id="picker-overlay" class="modal-overlay picker-overlay hidden">
      <div id="picker-container" class="modal-card picker-modal-card"></div>
    </div>
  </div>

  <!-- БЛОК 10. Подключение модулей ядра (Core Modules) -->
  <script src="js/core/storage.js?v=1.2.4"></script>
  <script src="js/core/theme.js?v=1.2.4"></script>
  <script src="js/core/audio.js?v=1.2.4"></script>

  <!-- БЛОК 11. Подключение UI-компонентов (Component Modules) -->
  <script src="js/components/modal.js?v=1.2.4"></script>
  <script src="js/components/picker.js?v=1.2.4"></script>
  <script src="js/components/timer.js?v=1.2.4"></script>
  <script src="js/components/chart.js?v=1.2.4"></script>
  <script src="js/components/plate-calc.js?v=1.2.4"></script>

  <!-- БЛОК 12. Подключение экранных контроллеров (Screen Modules) -->
  <script src="js/screens/habits.js?v=1.2.4"></script>
  <script src="js/screens/workout.js?v=1.2.4"></script>
  <script src="js/screens/stats.js?v=1.2.4"></script>
  <script src="js/screens/profile.js?v=1.2.4"></script>

  <!-- БЛОК 13. Главный маршрутизатор и инициализатор (Main Application Router) -->
  <script src="js/app.js?v=1.2.4"></script>
</body>
</html>
