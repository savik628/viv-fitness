services:
  viv-fitness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viv-fitness
    restart: unless-stopped
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
